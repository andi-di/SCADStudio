[package]
name = "scadstudio"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[dependencies]
anyhow = "1"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
pollster = "1"
png = "0.18"
